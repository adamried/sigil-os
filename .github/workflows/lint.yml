name: Lint

on:
  pull_request:
    branches: [main]
    paths:
      - "sigil-plugin/**"
      - "codex-source/neutral/**"
      - "tools/workflow-linter.py"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "sigil-plugin/**"
      - "codex-source/neutral/**"
      - "tools/workflow-linter.py"
      - ".github/workflows/lint.yml"

jobs:
  workflow-linter:
    name: Workflow linter (sigil-plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run workflow linter
        run: python3 tools/workflow-linter.py --verbose
